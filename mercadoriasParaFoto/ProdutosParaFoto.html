<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Produtos Para foto</title>
    <style>
        @import "front.css";
    </style>
    <script src="script.js" defer></script>
</head>

<body>

    <div class="container">
        <h2>Produtos Para Foto</h2>

        <label for="arquivoCsv" class="inputT"">Insira o CSV principal</label>
        <input type=" file" id="arquivoCsv" accept=".csv" style="display: none;" />
        <label for="csvParaMesclar" class="inputT">Insira o CSV para mesclar</label>
        <input type="file" id="csvParaMesclar" accept=".csv" style="display: none;" />

        <button onclick="exportarCSV()" style="float: right;margin-right: 10px;">📥 Salvar / Exportar Planilha</button>
        <button onclick="entregarProdutos()" style="float: right; margin-right: 10px;">✅ Entregar Produtos</button>
        <button onclick="adicionarObservacao(document.getElementById('leitor').value, prompt('Digite a observação:'))" style="float: right; margin-right: 10px;">📝 Adicionar Observação</button>
        <hr style="margin-top: 20px; margin-bottom: 20px;">

        <div class="area-leitura">
            <label><b>Bipar Produto:</b></label><br><br>
            <input type="text" id="leitor" placeholder="Passe o leitor aqui..." autofocus />
            <div class="flex-area-leitura">
                <span id="mensagem" style="margin-left: 10px; color: red; font-weight: bold;"></span>

                <span class="tSimulacao">Simular Produto</span>

                <div class="switch-container">
                    <input id="switch-shadow" class="switch switch--shadow" type="checkbox">
                    <label for="switch-shadow"></label>
                </div>

                <span class="tRetornar">Retornar Produto</span>
            </div>
        </div>

        <table id="tabelaDados">
            <thead>
                <tr>
                    <th>CODIGO</th>
                    <th>NOME DO PRODUTO</th>
                    <th>DATA SEPARAÇÃO</th>
                    <th>DATA ENTREGA</th>
                    <th>DATA RETORNO</th>
                    <th>QUANT SEPARADO</th>
                    <th>QUANT ENTREGUE</th>
                    <th>STATUS</th>
                    <th>OBSERVAÇÃO</th>
                    <th>COD EAN</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
</body>

</html>
